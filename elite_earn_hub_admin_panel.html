<script>
const modules=[
['users','♙','User Profiles','Registered users, profile details, balances and activity','Manage users'],
['verification','◉','Face Verification','Review requests, approve or reject with a reason','Review requests'],
['raffles','✧','Raffles Management','Raffle records and user-wise participation','Open raffles'],

['withdrawals','↗','Withdrawal Requests','Review payout details and payment status','Pending queue'],
['conversion','⇄','SNX Conversion','Manage conversion requests and exchange rules','Open conversions'],
['balances','◈','Balance Management','Controlled balance adjustments and ledger','Manage balances'],
['platformwallet','▣','Platform Fee Wallet','Collected platform fees and fee transaction history','View wallet'],
['youtube','▶','YouTube Task Management','Like, View/Watch and Subscribe tasks & counters','Manage YouTube'],
['surfing','◉','Surfing Management','Surfing tasks, requests and submission review','Manage surfing'],
['tasks','☷','All Tasks Management','Published tasks, budgets, completions and submissions','Manage tasks'],
['taskrequests','✉','Task Requests','Review user requests to publish regular tasks','Review requests'],
['pinrequests','⌖','Pin Task Requests','Review dashboard pin placement requests','Review requests'],
['pinned','📌','View Pinned Tasks','Manage the three dashboard pinned-task slots','View pinned'],
['mandatory','◆','Mandatory Tasks','Create and manage admin-required tasks','Manage mandatory'],
['ads','▤','All Advertisements','All ad types, advertiser details and request status','Manage ads'],
['rating','★','Rating & Leaderboard','Rating points, rankings and leaderboard','View leaderboard'],
['services','◇','Services Management','Service-add requests and Explore Services listings','Manage services'],
['help','☏','Help & Feedback','Support requests, feedback and resolutions','Open support'],
['notifications','♧','Notification Center','Scrolling ticker and targeted bell notifications','Manage notices'],
['gifts','🎁','Send SNX Gift','Send one-time gifts and review claim history','Send a gift'],
['access','⊘','User Access Control','Search, block and unblock accounts','Manage access'],
['settings','⚙','Platform Settings','SNX rate, fees, limits and platform configuration','Configure'],
['security','⛨','Admin Security & Audit','Role security, sensitive actions and audit review','Security review'],
['reports','▥','Reports & Monitoring','Financial summaries, task reports and integrity','View reports'],
['activity','◷','Activity Logs','Chronological administrator and system events','View logs']
];
const pageTitles={overview:'Dashboard Overview',users:'User Profiles',verification:'Face Verification',raffles:'Raffles Management',rating:'Rating & Leaderboard',deposits:'Deposit Requests',withdrawals:'Withdrawal Requests',conversion:'SNX Conversion',balances:'Balance Management',platformwallet:'Platform Fee Wallet',youtube:'YouTube Task Management',surfing:'Surfing Management',tasks:'All Tasks Management',taskrequests:'Task Requests',pinrequests:'Pin Task Requests',pinned:'View Pinned Tasks',mandatory:'Mandatory Tasks',ads:'All Advertisements',services:'Services Management',help:'Help & Feedback',notifications:'Notification Center',gifts:'Send SNX Gift',access:'User Access Control',settings:'Platform Settings',security:'Admin Security & Audit',reports:'Reports & Monitoring',activity:'Activity Logs'};
let active='overview',sub='Like',demoData={},settings=JSON.parse(localStorage.getItem('ehAdminSettings')||'{"rate":4,"min":300,"fee":30,"depositFee":0,"withdrawFee":0,"taskFee":10,"adFee":10,"ticker":"Welcome to Elite Earn Hub — stay active, complete tasks and grow your SNX rewards."}');
let logs=JSON.parse(localStorage.getItem('ehAdminLogs')||'[]');
function log(action){logs.unshift({action,time:new Date().toLocaleString()});logs=logs.slice(0,100);localStorage.setItem('ehAdminLogs',JSON.stringify(logs))}
function money(n){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:4})}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',3500)}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')}
function go(p){active=p;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('breadcrumb').textContent='Workspace / '+(pageTitles[p]||p);document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');render();window.scrollTo({top:0,behavior:'smooth'})}
function cardStats(label,value,icon,subtext='Prototype data'){return `<div class="stat"><div class="stathead"><span>${label}</span><span class="staticon">${icon}</span></div><strong>${value}</strong><small>${subtext}</small></div>`}
function moduleCard(m){return `<div class="module" onclick="go('${m[0]}')"><div class="moduletop"><div class="moduleicon">${m[1]}</div><span class="pill">Open ↗</span></div><h3>${m[2]}</h3><p>${m[3]}</p><div class="modulefoot"><span>${m[4]}</span><b>Explore →</b></div></div>`}
function pageHead(title,desc,buttons=''){return `<div class="pagehead"><div><div class="eyebrow">Elite Earn Hub / Control</div><h1>${title}</h1><p>${desc}</p></div><div class="page-actions">${buttons}</div></div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}"><div class="empty"><div class="big">◇</div>No live records connected yet.<br><small>Connect the secure backend to display real data here.</small></div></td></tr>`}</tbody></table></div>`}
function status(s='Pending'){let c=s.toLowerCase();if(['verified','approved','active','paid','resolved','completed','published','claimed'].includes(c))c='approved';else if(['rejected','blocked','closed'].includes(c))c='rejected';else if(['processing','in progress'].includes(c))c='processing';else c='pending';return `<span class="status ${c}">${s}</span>`}
function btn(text,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${text}</button>`}
function modal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalback').style.display='flex'}
function closeModal(){document.getElementById('modalback').style.display='none'}
function field(label,name,placeholder='',type='text',value=''){return `<div class="formrow"><label>${label}</label><input class="field" name="${name}" type="${type}" placeholder="${placeholder}" value="${value}" /></div>`}
function formModal(title,fields,submitLabel,action){modal(title,`<form class="formgrid" onsubmit="event.preventDefault();${action}(new FormData(this));closeModal()">${fields}<div class="formrow full" style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn primary">${submitLabel}</button></div></form>`)}
function genericRows(p){let rows=[];let data=demoData[p]||[];data.forEach((x,i)=>rows.push(`<tr>${x.map(v=>`<td>${v}</td>`).join('')}<td><button class="btn small" onclick="recordAction('${p}',${i},'Approved')">Approve</button> <button class="btn small danger" onclick="recordAction('${p}',${i},'Rejected')">Reject</button></td></tr>`));return rows.join('')}
function recordAction(p,i,s){if(!demoData[p])return;demoData[p][i][demoData[p][i].length-1]=status(s);log(`${pageTitles[p]} record ${i+1}: ${s}`);render();toast(`${s} in local preview only. Backend is not connected.`)}
function dashboard(){return `
<div class="welcome"><div><div class="eyebrow">Premium administration suite</div><h1>Good day, Sunny Jatt <span style="color:var(--gold)">✦</span></h1><p>Control your platform, members, transactions and task ecosystem from one place.</p></div><div style="display:flex;gap:9px;flex-wrap:wrap">${btn('＋ Create Mandatory Task',"go('mandatory')",'primary')}${btn('View Reports',"go('reports')")}</div></div>
<div class="hero"><div class="eyebrow">ELITE EARN HUB · ADMIN PANEL</div><h2>One command center. Complete visibility.</h2><p>Manage registrations, verification, SNX wallets, advertising, tasks, services and member support through a consistent, premium interface.</p><div class="herofoot"><span class="pill gold">✦ 1 SNX = ${settings.rate} PKR</span><span class="pill">◉ Face verification controls</span><span class="pill">▣ Fee wallet enabled in structure</span><span class="pill">⚠ UI Preview — not live-connected</span></div></div>
<div class="grid stats">${cardStats('Total Registrations','—','♙','Awaiting database connection')}${cardStats('Pending Verification','0','◉','Live count after backend connection')}${cardStats('Pending Deposits','0','＋','Live count after backend connection')}${cardStats('Pending Withdrawals','0','↗','Live count after backend connection')}${cardStats('Active Tasks','—','☷','Awaiting database connection')}${cardStats('Active Surfing Tasks','—','◉','Awaiting database connection')}${cardStats('YouTube Like / View / Subscribe','—','▶','Counters belong inside YouTube management')}${cardStats('Platform Fees Collected','0 SNX','▣','Local preview only')}</div>
<div class="sectionhead"><div><h2>Management modules</h2><p>Every major function has its own dedicated card and workspace.</p></div><span class="pill gold">26 modules</span></div>
<div class="grid modulegrid">${modules.map(moduleCard).join('')}</div>
<div class="sectionhead"><div><h2>Operational snapshot</h2><p>Sample visualization only — no real user data loaded.</p></div></div>
<div class="grid two-col"><div class="panel"><h3>Platform activity</h3><div class="sub">Illustrative distribution; replace with live analytics</div><div class="barrow"><div class="barlabel"><span>Tasks & submissions</span><span>—</span></div><div class="bar"><span style="width:72%"></span></div></div><div class="barrow"><div class="barlabel"><span>Advertisements</span><span>—</span></div><div class="bar"><span style="width:54%;background:linear-gradient(90deg,#66b7ff,#8b72ff)"></span></div></div><div class="barrow"><div class="barlabel"><span>Finance requests</span><span>—</span></div><div class="bar"><span style="width:37%;background:linear-gradient(90deg,#45d6a0,#66b7ff)"></span></div></div></div><div class="panel"><h3>Quick access</h3><div class="sub">Frequently used admin tools</div><div class="quicklist">${[['＋','Deposit requests','Review payment proof','deposits'],['↗','Withdrawal requests','Track payout status','withdrawals'],['▣','Platform Fee Wallet','Review fee collection','platformwallet'],['♧','Notifications','Publish ticker or bell notices','notifications']].map(q=>`<div class="quick" onclick="go('${q[3]}')" style="cursor:pointer"><div class="qicon">${q[0]}</div><div><b>${q[1]}</b><small>${q[2]}</small></div><span class="arrow">→</span></div>`).join('')}</div></div></div>
<div class="footer"><span>© Elite Earn Hub · Admin Control Center</span><span>Admin: Sunny Jatt · Secure backend integration required</span></div>`}
function recordsPage(p,title,desc,headers,actions=''){return `${pageHead(title,desc,actions)}<div class="notice">Preview mode: this screen is ready for UI review. Approvals, balance changes, counts and notifications require a secure backend before production use.</div><div class="toolbar"><input class="field search" placeholder="Search records (UI preview)" oninput="filterTable(this)"><select class="field" onchange="filterTable(document.querySelector('.toolbar .search'))"><option value="">All statuses</option><option>Pending</option><option>Approved</option><option>Rejected</option><option>Processing</option></select><button class="btn" onclick="toast('Export requires connected live records.')">Export</button></div>${table(headers,genericRows(p))}`}
function youtubePage(){return `${pageHead('YouTube Task Management','Manage YouTube Like, View/Watch and Subscribe task categories.') }<div class="grid stats">${cardStats('YouTube Like Tasks','—','♥','Live database counter')}${cardStats('YouTube View / Watch','—','▶','View and Watch are one category')}${cardStats('YouTube Subscribe','—','＋','Live database counter')}${cardStats('Pending Submissions','—','◷','Requires backend')}</div><div class="subtabs">${['Like','View / Watch','Subscribe'].map(s=>`<button class="subtab ${sub===s?'active':''}" onclick="sub='${s}';render()">${s}</button>`).join('')}</div><div class="panel"><div class="sectionhead" style="margin-top:0"><div><h3>YouTube ${sub} Tasks</h3><p>Task link, publisher, reward, budget and submission review.</p></div>${btn('＋ Add task',"newRecord('youtube')",'primary')}</div>${table(['Task','Publisher','Reward (SNX)','Budget (SNX)','Submissions','Status','Actions'],'')}<div class="empty">No live YouTube task records. Connect task tables to populate this page.</div></div>`}
function settingsPage(){return `${pageHead('Platform Settings','Centralized configuration for rates, fees, limits and platform behavior.',btn('Save Settings',"saveSettings()",'primary'))}<div class="notice">Values below are stored only in this browser for this UI preview. Production settings must be saved server-side and protected by admin permissions.</div><div class="grid two-col"><div class="panel"><h3>SNX & conversion</h3><p class="sub">Initial values from the agreed project structure</p><div class="formgrid">${field('1 SNX value in PKR','rate','4','number',settings.rate)}${field('Minimum conversion (SNX)','min','300','number',settings.min)}${field('Conversion fee (SNX)','fee','30','number',settings.fee)}</div><div style="margin-top:15px">${btn('Save SNX settings',"saveSettings()",'primary')}</div></div><div class="panel"><h3>Platform fee rules</h3><p class="sub">Fee percentages/amounts must be clearly shown to users.</p><div class="formgrid">${field('Deposit fee (%)','depositFee','0','number',settings.depositFee)}${field('Withdrawal fee (SNX)','withdrawFee','0','number',settings.withdrawFee)}${field('Task platform fee (%)','taskFee','10','number',settings.taskFee)}${field('Advertisement fee (%)','adFee','10','number',settings.adFee)}</div><div style="margin-top:15px">${btn('Save fee rules',"saveSettings()",'primary')}</div></div><div class="panel"><h3>Platform controls</h3><div class="switchrow"><div><b>Maintenance mode</b><small>Pause user-facing actions when enabled</small></div><input type="checkbox" class="switch" id="maintenance"></div><div class="switchrow"><div><b>Require approved face verification for deposits</b><small>Server-side enforcement required</small></div><input type="checkbox" class="switch" checked></div><div class="switchrow"><div><b>Require approved face verification for withdrawals</b><small>Server-side enforcement required</small></div><input type="checkbox" class="switch" checked></div></div><div class="panel"><h3>Dashboard ticker</h3><p class="sub">Ticker is separate from bell notifications.</p><textarea id="tickerText" class="field" style="width:100%;min-height:110px">${settings.ticker}</textarea><div style="margin-top:12px">${btn('Save ticker',"saveTicker()",'primary')}</div></div></div>`}
function walletPage(){return `${pageHead('Platform Fee Wallet','Separate platform-owned SNX fee balance and auditable fee ledger.')}<div class="notice">This wallet is a platform accounting ledger, not a normal user balance. Every fee credit must be created atomically with its source transaction; never trust browser-side balance updates.</div><div class="grid stats">${cardStats('Current fee wallet balance','0 SNX','▣','No live ledger connected')}${cardStats('Deposit fees','0 SNX','＋','Only if deposit fees are configured')}${cardStats('Withdrawal fees','0 SNX','↗','Collected from completed withdrawals')}${cardStats('Task & ad fees','0 SNX','◆','Collected from completed transactions')}</div><div class="panel"><div class="sectionhead" style="margin-top:0"><div><h3>Fee transaction history</h3><p>Source transaction, fee type, amount, timestamp and reference.</p></div>${btn('Export ledger',"toast('Ledger export requires backend data.')")}</div>${table(['Reference','Fee type','User / Source','Fee (SNX)','Date','Status'],'')}</div>`}
function notificationsPage(){return `${pageHead('Notification Center','Manage the scrolling dashboard ticker and bell notifications separately.')}<div class="grid two-col"><div class="panel"><h3>Scrolling ticker editor</h3><p class="sub">Persistent message strip at the top of the user dashboard.</p><div class="formrow"><label>Ticker message</label><textarea id="tickerText" class="field">${settings.ticker}</textarea></div><div style="margin-top:12px">${btn('Save ticker',"saveTicker()",'primary')}</div></div><div class="panel"><h3>Send bell notification</h3><p class="sub">Send to one user, selected users or everyone.</p><form class="formgrid" onsubmit="event.preventDefault();sendNotice(new FormData(this))">${field('Notification title','title','e.g. Deposit approved')}${field('Recipient','recipient','User ID / username / ALL') }<div class="formrow full"><label>Message</label><textarea class="field" name="message" required placeholder="Write a clear notification..."></textarea></div><div class="formrow full"><button class="btn primary">Send notification</button></div></form></div></div><div class="sectionhead"><div><h2>Notification history</h2><p>Preview logs saved in this browser only.</p></div></div>${table(['Title / Action','Recipient','Time','Status'],logs.filter(x=>x.action.startsWith('Notification:')).map(x=>`<tr><td>${x.action}</td><td>Preview recipient</td><td>${x.time}</td><td>${status('Pending')}</td></tr>`).join(''))}`}
function genericPage(p){const map={
users:['User Profiles','Search and open registered user profiles. Profile fields include Main Balance, Advertisement Balance, deposits, withdrawals, referrals, task status and raffle count.',['User ID','Username','Email','Main Balance','Ad Balance','Status','Actions']],
verification:['Face Verification Requests','Review consented verification submissions. A decision should record reviewer, timestamp and rejection reason.',['User','Submitted','Review deadline','Status','Actions']],
raffles:['Raffles Management','View raffle records, participation history and user-wise entries.',['Raffle','User','Entries','Date','Status','Actions']],
rating:['Rating & Leaderboard','Manage rating points and inspect descending user rankings.',['Rank','User','Rating Points','Completed Tasks','Actions']],
deposits:['Deposit Requests','Review amount, payment method, transaction reference, proof and timestamp. Approve only after confirming payment.',['User','Amount','Method','Transaction ID','Submitted','Status','Actions']],
withdrawals:['Withdrawal Requests','Track requested amount, SNX/PKR equivalent, payout destination and payment state. Approval is not the same as payment sent.',['User','Amount','Destination','Requested','Status','Actions']],
conversion:['SNX Conversion','Review conversion requests and apply centrally configured conversion rules.',['User','SNX amount','PKR value','Fee','Date','Status','Actions']],
balances:['Balance Management','Controlled main/advertisement balance adjustments with mandatory reason and immutable ledger entry.',['User','Balance type','Current SNX','Adjustment','Reason','Actions']],
surfing:['Surfing Management','Manage published surfing tasks, duration, link, reward, budget and submission statuses.',['Task','Publisher','Duration','Reward','Budget','Completed','Status','Actions']],
tasks:['All Tasks Management','Separate published tasks, publishing requests and user submissions/completions.',['Task','Publisher','Budget','Completed','Pending','Rejected','Status','Actions']],
taskrequests:['Task Requests','Review user requests to publish regular tasks; rejection reasons should be sent to the requester.',['Requester','Task details','Budget','Submitted','Status','Actions']],
pinrequests:['Pin Task Requests','Review user requests to pin a task on the dashboard.',['Requester','Task','Budget','Submitted','Status','Actions']],
pinned:['View Pinned Tasks','Manage the three dashboard pinned-task slots and their visibility.',['Slot','Task title','Category','Reward','Status','Actions']],
mandatory:['Mandatory Tasks','Create required tasks, assign target users, and track completion, spend and remaining budget.',['Task','Target users','Completed','Budget','Spent','Remaining','Status','Actions']],
ads:['All Advertisements','All advertiser requests and published ads across YouTube, surfing and other task categories.',['Ad ID','Type','Advertiser','Budget','Submissions','Status','Actions']],
services:['Services Management','Approve service-add requests and manage approved services shown in Explore Services.',['Service','Provider','Submitted','Listing status','Actions']],
help:['Help & Feedback','Track help requests (Pending/In Progress/Solved) and review or close user feedback.',['Type','User','Subject / Feedback','Submitted','Status','Actions']],
gifts:['Send SNX Gift','Send SNX to a user with recipient confirmation and one-time claim protection.',['Gift ID','Recipient','Amount','Created','Claim status','Actions']],
access:['User Access Control','Search users by ID, username or email; block/unblock through server-side authorization.',['User','Email','Account status','Blocked at','Reason','Actions']],
security:['Admin Security & Audit','Production must enforce admin roles on the server and keep sensitive action audit trails.',['Event','Actor','Target','Timestamp','Result','Actions']],
reports:['Reports & Monitoring','Summaries for registrations, deposits, withdrawals, tasks, ads, SNX credits/debits and integrity checks.',['Report','Period','Records','Status','Actions']],
activity:['Activity Logs','Chronological log of administrative actions and failed operations.',['Action','Actor','Target','Timestamp','Result','Actions']]
};let d=map[p]||[pageTitles[p]||'Management','Dedicated management workspace.',['Item','Owner','Date','Status','Actions']];let act='';if(['users','deposits','withdrawals','balances','gifts','mandatory','services','tasks','surfing','ads','pinned'].includes(p))act=btn('+ Add / Create',"newRecord('"+p+"')",'primary');return recordsPage(p,d[0],d[1],d[2],act)}
function genericAction(p,fd){let vals=[...fd.values()].map(v=>String(v||'—').replace(/[<>]/g,''));let row;if(p==='users')row=[vals[0]||'Demo User',vals[1]||'demo_user',vals[2]||'demo@example.com','0 SNX','0 SNX',status('Pending')];else if(p==='gifts')row=['GIFT-'+Date.now().toString().slice(-5),vals[0]||'Recipient',vals[1]||'0 SNX',new Date().toLocaleString(),status('Pending')];else row=[vals[0]||'New item',vals[1]||'Admin',vals[2]||new Date().toLocaleDateString(),status('Pending')];if(!demoData[p])demoData[p]=[];demoData[p].push(row);log(`Preview record added to ${pageTitles[p]}`);render();toast('Demo record added to this page only. Not saved to the live platform.')}
function newRecord(p){let fields='';if(p==='users')fields=field('Username','username','username')+field('Email','email','email@example.com','email')+field('User ID','id','UUID');else if(p==='gifts')fields=field('Recipient user ID / username','recipient','User ID or username')+field('Gift amount (SNX)','amount','Amount','number');else if(p==='mandatory')fields=field('Task title','title','Task title')+field('Category','category','Category')+field('Reward (SNX)','reward','Reward','number')+field('Total budget (SNX)','budget','Budget','number')+field('Target users','target','Number of users','number')+`<div class="formrow full"><label>Instructions / link</label><textarea name="instructions" class="field"></textarea></div>`;else fields=field('Title / task / service','title','Enter title')+field('Owner / user','owner','Username or ID')+field('Budget / reward','budget','Amount or budget','number')+`<div class="formrow full"><label>Details / link / reason</label><textarea name="details" class="field" placeholder="Add relevant details"></textarea></div>`;formModal('Create '+(pageTitles[p]||'record'),fields,'Save preview record',`genericAction.bind(null,'${p}')`)}
function saveSettings(){const fields=document.querySelectorAll('.content input[name],.content select[name]');fields.forEach(f=>{if(f.name in settings&&f.value!=='' )settings[f.name]=Number(f.value)});['rate','min','fee','depositFee','withdrawFee','taskFee','adFee'].forEach(k=>{let el=document.querySelector(`[name="${k}"]`);if(el&&el.value!=='')settings[k]=Number(el.value)});localStorage.setItem('ehAdminSettings',JSON.stringify(settings));log('Platform settings saved in local preview');render();toast('Saved in this browser preview only. Not synced to your users.')}
function saveTicker(){let t=document.getElementById('tickerText');if(t)settings.ticker=t.value;localStorage.setItem('ehAdminSettings',JSON.stringify(settings));log('Ticker message updated in local preview');toast('Ticker saved locally. User dashboard will not update until backend integration.')}
function sendNotice(fd){log(`Notification: ${fd.get('title')||'Notice'} — ${fd.get('message')||''}`);toast('Preview notification recorded locally; not delivered to users.')}
function filterTable(input){if(!input)return;let q=input.value.toLowerCase();let wrap=input.closest('.content')||document;wrap.querySelectorAll('tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none')}
function render(){let c=document.getElementById('content');if(active==='overview')c.innerHTML=dashboard();else if(active==='settings')c.innerHTML=settingsPage();else if(active==='platformwallet')c.innerHTML=walletPage();else if(active==='notifications')c.innerHTML=notificationsPage();else if(active==='youtube')c.innerHTML=youtubePage();else if(active==='deposits')c.innerHTML=genericPage('deposits');else if(active==='withdrawals')c.innerHTML=genericPage('withdrawals');else if(active==='users')c.innerHTML=genericPage('users');else if(active==='mandatory')c.innerHTML=genericPage('mandatory');else c.innerHTML=genericPage(active);document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===active));}
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
render();
</script>
</body>
</html>
