<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register - Elite Earn Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #06101d;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .register-box {
      width: 100%;
      max-width: 430px;
      background: #0d1b2e;
      border: 1px solid #24445f;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .brand {
      text-align: center;
      color: #38bdf8;
      font-size: 27px;
      font-weight: 900;
      margin-bottom: 7px;
    }

    .subtitle {
      text-align: center;
      color: #8fa7bd;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      color: #c9d8e6;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #29465f;
      background: #081522;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #38bdf8;
    }

    .register-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 11px;
      background: #1687d9;
      color: white;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 5px;
    }

    .register-btn:hover {
      opacity: .9;
    }

    .register-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .success {
      display: block;
      background: #07351f;
      border: 1px solid #147a49;
      color: #8ff0bf;
    }

    .error {
      display: block;
      background: #3b1018;
      border: 1px solid #8e2637;
      color: #ffb5bf;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #8fa7bd;
      font-size: 12px;
    }

    .login-link a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 800;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #667c90;
      font-size: 10px;
    }
  </style>
</head>

<body>

  <div class="register-box">

    <div class="brand">
      Elite Earn Hub
    </div>

    <div class="subtitle">
      Create your account and start earning
    </div>

    <form id="registerForm">

      <div class="field">
        <label>Username</label>

        <input
          type="text"
          id="username"
          placeholder="Enter username"
          required
          minlength="3"
        >
      </div>


      <div class="field">
        <label>Email</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >
      </div>


      <div class="field">
        <label>Password</label>

        <input
          type="password"
          id="password"
          placeholder="Create password"
          required
          minlength="6"
        >
      </div>


      <div class="field">
        <label>Confirm Password</label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm password"
          required
          minlength="6"
        >
      </div>


      <button
        type="submit"
        class="register-btn"
        id="registerBtn"
      >
        Create Account
      </button>

    </form>


    <div
      id="message"
      class="message"
    ></div>


    <div class="login-link">

      Already have an account?

      <a href="login.html">
        Login
      </a>

    </div>


    <div class="footer">
      © 2026 Elite Earn Hub
    </div>

  </div>


  <script>

    /* ======================================
       SUPABASE CONFIG
       ====================================== */

    const SUPABASE_URL =
      "https://cdgmtleyzggeryvugcrf.supabase.co";

    const SUPABASE_PUBLIC_KEY =
      "sb_publishable_9veiB1eRPPyLHR8X2oldMQ_AcLz9Jb2";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLIC_KEY
      );


    /* ======================================
       ELEMENTS
       ====================================== */

    const form =
      document.getElementById("registerForm");

    const usernameInput =
      document.getElementById("username");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const confirmPasswordInput =
      document.getElementById("confirmPassword");

    const registerBtn =
      document.getElementById("registerBtn");

    const message =
      document.getElementById("message");


    /* ======================================
       MESSAGE
       ====================================== */

    function showMessage(
      text,
      type
    ) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    /* ======================================
       REGISTER
       ====================================== */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const username =
          usernameInput.value.trim();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        const confirmPassword =
          confirmPasswordInput.value;


        if (password !== confirmPassword) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;
        }


        if (password.length < 6) {

          showMessage(
            "Password must be at least 6 characters.",
            "error"
          );

          return;
        }


        registerBtn.disabled = true;

        registerBtn.textContent =
          "Creating Account...";


        const {
          data,
          error
        } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {
                username: username
              },

              emailRedirectTo:
                window.location.origin +
                "/login.html"

            }

          });


        if (error) {

          registerBtn.disabled = false;

          registerBtn.textContent =
            "Create Account";

          showMessage(
            error.message,
            "error"
          );

          return;
        }


        showMessage(
          "Registration successful! Please check your email and confirm your account before logging in.",
          "success"
        );


        form.reset();


        registerBtn.disabled = false;

        registerBtn.textContent =
          "Create Account";

      }
    );

  </script>

</body>
</html>
