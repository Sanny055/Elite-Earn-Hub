<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TEST REGISTER 123</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #06101d;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #0d1b2e;
      border: 1px solid #24445f;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,.3);
    }

    .logo {
      text-align: center;
      color: #38bdf8;
      font-size: 28px;
      font-weight: 900;
    }

    .subtitle {
      text-align: center;
      color: #8fa7bd;
      font-size: 13px;
      margin-top: 7px;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      color: #d7e5f2;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #29465f;
      background: #081522;
      color: white;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 11px;
      background: #1687d9;
      color: white;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 4px;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .success {
      display: block !important;
      background: #07351f;
      border: 1px solid #147a49;
      color: #8ff0bf;
    }

    .error {
      display: block !important;
      background: #3b1018;
      border: 1px solid #8e2637;
      color: #ffb5bf;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #8fa7bd;
      font-size: 12px;
    }

    .login a {
      color: #38bdf8;
      font-weight: 800;
      text-decoration: none;
    }

    .footer {
      text-align: center;
      color: #667c90;
      font-size: 10px;
      margin-top: 22px;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      Elite Earn Hub
    </div>

    <div class="subtitle">
      Create your account
    </div>

    <form id="registerForm">

      <div class="field">
        <label>Username</label>

        <input
          id="username"
          type="text"
          placeholder="Enter username"
          minlength="3"
          required
        >
      </div>

      <div class="field">
        <label>Email</label>

        <input
          id="email"
          type="email"
          placeholder="Enter email"
          required
        >
      </div>

      <div class="field">
        <label>Password</label>

        <input
          id="password"
          type="password"
          placeholder="Enter password"
          minlength="6"
          required
        >
      </div>

      <div class="field">
        <label>Confirm Password</label>

        <input
          id="confirmPassword"
          type="password"
          placeholder="Confirm password"
          minlength="6"
          required
        >
      </div>

      <button
        id="registerBtn"
        type="submit"
      >
        Create Account
      </button>

    </form>

    <div id="message"></div>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

    <div class="footer">
      © 2026 Elite Earn Hub
    </div>

  </div>


  <script>

    /* =====================================
       SUPABASE CONNECTION
       ===================================== */

    const SUPABASE_URL = "https://cdgmtleyzggeryvugcrf.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_9veiB1eRPPyLHR8X2oldMQ_AcLz9Jb2";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* =====================================
       ELEMENTS
       ===================================== */

    const form =
      document.getElementById("registerForm");

    const username =
      document.getElementById("username");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const confirmPassword =
      document.getElementById("confirmPassword");

    const registerBtn =
      document.getElementById("registerBtn");

    const message =
      document.getElementById("message");


    /* =====================================
       MESSAGE FUNCTION
       ===================================== */

    function showMessage(text, type) {

      message.textContent = text;

      message.className = type;

    }


    /* =====================================
       REGISTER
       ===================================== */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const userNameValue =
          username.value.trim();

        const emailValue =
          email.value.trim();

        const passwordValue =
          password.value;

        const confirmValue =
          confirmPassword.value;


        if (passwordValue !== confirmValue) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;

        }


        if (passwordValue.length < 6) {

          showMessage(
            "Password must contain at least 6 characters.",
            "error"
          );

          return;

        }


        registerBtn.disabled = true;

        registerBtn.textContent =
          "Creating Account...";


        try {

          const {
            data,
            error
          } =
            await supabaseClient.auth.signUp({

              email: emailValue,

              password: passwordValue,

              options: {

                data: {
                  username: userNameValue
                },

                emailRedirectTo:
                  window.location.origin +
                  "/login.html"

              }

            });


          if (error) {

            throw error;

          }


          showMessage(
            "Account created successfully. Please check your email and confirm your account.",
            "success"
          );


          form.reset();


        } catch (error) {

          showMessage(
            error.message ||
            "Registration failed. Please try again.",
            "error"
          );

        }


        registerBtn.disabled = false;

        registerBtn.textContent =
          "Create Account";

      }

    );

  </script>

</body>
          </html>
