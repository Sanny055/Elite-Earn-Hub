<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Elite Earn Hub - Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #07111f;
      color: white;
      padding: 20px;
    }

    .dashboard {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    .header {
      background: #0d1b2e;
      border: 1px solid #29445f;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .welcome {
      font-size: 28px;
      font-weight: 800;
      color: #38bdf8;
    }

    .email {
      color: #8da3ba;
      font-size: 13px;
      margin-top: 8px;
      word-break: break-word;
    }

    .balance {
      background: #0d1b2e;
      border: 1px solid #29445f;
      border-radius: 18px;
      padding: 28px;
      text-align: center;
      margin-bottom: 20px;
    }

    .balance-title {
      color: #8da3ba;
      font-size: 14px;
    }

    .balance-amount {
      color: #38bdf8;
      font-size: 40px;
      font-weight: 800;
      margin-top: 8px;
    }

    .balance-name {
      color: #8da3ba;
      font-size: 12px;
      margin-top: 5px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .card {
      background: #0d1b2e;
      border: 1px solid #29445f;
      border-radius: 15px;
      padding: 22px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
    }

    .icon {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
    }

    .card-text {
      color: #8da3ba;
      font-size: 12px;
      margin-top: 6px;
    }

    .logout {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #b42335;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .logout:disabled {
      opacity: 0.6;
    }

    #pageMessage {
      text-align: center;
      padding: 40px 10px;
      color: #8da3ba;
    }

    @media (max-width: 550px) {
      body {
        padding: 14px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .welcome {
        font-size: 24px;
      }

      .balance-amount {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <div id="pageMessage">
    Checking your account...
  </div>


  <div class="dashboard" id="dashboard" style="display:none;">

    <div class="header">

      <div class="welcome">
        Welcome to Elite Earn Hub
      </div>

      <div class="email" id="userEmail">
        Loading...
      </div>

    </div>


    <div class="balance">

      <div class="balance-title">
        Your Balance
      </div>

      <div class="balance-amount">
        0
      </div>

      <div class="balance-name">
        Points
      </div>

    </div>


    <div class="cards">

      <div class="card">
        <div class="icon">🎯</div>
        <div class="card-title">Tasks</div>
        <div class="card-text">
          Complete available tasks
        </div>
      </div>


      <div class="card">
        <div class="icon">👥</div>
        <div class="card-title">Referrals</div>
        <div class="card-text">
          Manage your referrals
        </div>
      </div>


      <div class="card">
        <div class="icon">💸</div>
        <div class="card-title">Withdraw</div>
        <div class="card-text">
          Manage withdrawal requests
        </div>
      </div>


      <div class="card">
        <div class="icon">📊</div>
        <div class="card-title">History</div>
        <div class="card-text">
          View your activity
        </div>
      </div>


      <div class="card">
        <div class="icon">👤</div>
        <div class="card-title">Profile</div>
        <div class="card-text">
          Manage your account
        </div>
      </div>

    </div>


    <button
      class="logout"
      id="logoutBtn"
    >
      Logout
    </button>

  </div>


  <script>

    /* =====================================
       SUPABASE CONFIG
       ===================================== */

    const SUPABASE_URL = "https://cdgmtleyzggeryvugcrf.supabase.co";

    const SUPABASE_PUBLIC_KEY = "sb_publishable_9veiB1eRPPyLHR8X2oldMQ_AcLz9Jb2";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLIC_KEY
      );


    /* =====================================
       CHECK LOGIN SESSION
       ===================================== */

    async function checkUser() {

      const {
        data,
        error
      } = await supabaseClient.auth.getSession();


      if (error || !data.session) {

        window.location.replace("login.html");

        return;
      }


      const user = data.session.user;


      document.getElementById("userEmail")
        .textContent = user.email || "User";


      document.getElementById("pageMessage")
        .style.display = "none";


      document.getElementById("dashboard")
        .style.display = "block";
    }


    checkUser();


    /* =====================================
       LOGOUT
       ===================================== */

    document
      .getElementById("logoutBtn")
      .addEventListener("click", async function() {

        const logoutBtn =
          document.getElementById("logoutBtn");


        logoutBtn.disabled = true;
        logoutBtn.textContent = "Logging out...";


        const { error } =
          await supabaseClient.auth.signOut();


        if (error) {

          logoutBtn.disabled = false;
          logoutBtn.textContent = "Logout";

          alert(
            "Logout failed. Please try again."
          );

          return;
        }


        window.location.replace("login.html");

      });


    /* =====================================
       SESSION CHANGE
       ===================================== */

    supabaseClient.auth.onAuthStateChange(
      function(event, session) {

        if (
          event === "SIGNED_OUT" ||
          !session
        ) {
          window.location.replace("login.html");
        }

      }
    );

  </script>

</body>
  </html>
