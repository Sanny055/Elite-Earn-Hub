<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Elite Earn Hub - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #07111f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #0d1b2e;
      padding: 30px;
      border-radius: 18px;
      border: 1px solid #29445f;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    .welcome {
  text-align: center;
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 5px;
  margin-bottom: 10px;
  font-family: Arial, sans-serif;
  text-transform: uppercase;
  background: linear-gradient(90deg, #ffffff, #38bdf8, #ffffff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 18px rgba(56, 189, 248, 0.25);
      }

    .brand {
      text-align: center;
      color: #38bdf8;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #8da3ba;
      margin-bottom: 28px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      color: #d6e2ee;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 17px;
      border: 1px solid #29445f;
      border-radius: 9px;
      background: #081522;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #1687d9;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .register {
      text-align: center;
      margin-top: 20px;
      color: #8da3ba;
      font-size: 13px;
    }

    .register a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
    }

    .whatsapp-section {
      text-align: center;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #21384e;
    }

    .whatsapp-text {
      color: #8da3ba;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .whatsapp-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #25D366;
      color: white;
      text-decoration: none;
      font-size: 27px;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .whatsapp-icon:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="welcome">
      WELCOME
    </div>

    <div class="brand">
      Elite Earn Hub
    </div>

    <div class="subtitle">
      Login to your account
    </div>


    <!-- LOGIN FORM -->

    <form>

      <label>Email</label>

      <input
        type="email"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>

      <input
        type="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>


    <!-- REGISTER -->

    <div class="register">
      Don't have an account?
      <a href="#">
        Register
      </a>
    </div>


    <!-- WHATSAPP -->

    <div class="whatsapp-section">

      <div class="whatsapp-text">
        Need Help? Contact us on WhatsApp
      </div>

      <a
        class="whatsapp-icon"
        href="https://wa.me/923028026575"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Contact us on WhatsApp"
      >
        ☎
      </a>

    </div>

  </div>

</body>
  </html>
