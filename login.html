<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Elite Earn Hub - Login</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #07111f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #0d1b2e;
      padding: 30px;
      border-radius: 18px;
      border: 1px solid #29445f;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }

    .welcome {
      text-align: center;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 5px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #ffffff, #38bdf8, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 18px rgba(56, 189, 248, 0.25);
    }

    .brand {
      text-align: center;
      color: #38bdf8;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #8da3ba;
      margin-bottom: 28px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      color: #d6e2ee;
    }

    .input-box {
      position: relative;
      margin-bottom: 17px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #29445f;
      border-radius: 9px;
      background: #081522;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #38bdf8;
    }

    .password-input {
      padding-right: 45px;
    }

    .show-password {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #8da3ba;
      font-size: 18px;
      user-select: none;
    }

    .forgot {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 18px;
    }

    .forgot a {
      color: #38bdf8;
      font-size: 12px;
      text-decoration: none;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #1687d9;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.5;
    }

    .register {
      text-align: center;
      margin-top: 20px;
      color: #8da3ba;
      font-size: 13px;
    }

    .register a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
    }

    .whatsapp-section {
      text-align: center;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #21384e;
    }

    .whatsapp-text {
      color: #8da3ba;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .whatsapp-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #25D366;
      color: white;
      text-decoration: none;
      font-size: 25px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      transition: 0.2s;
    }

    .whatsapp-icon:hover {
      transform: scale(1.08);
    }

    @media (max-width: 450px) {
      .login-box {
        padding: 25px 20px;
      }

      .welcome {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="welcome">WELCOME</div>

    <div class="brand">Elite Earn Hub</div>

    <div class="subtitle">Login to your account</div>


    <!-- LOGIN FORM -->

    <form id="loginForm">

      <label for="email">Email</label>

      <div class="input-box">
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>


      <label for="password">Password</label>

      <div class="input-box">

        <input
          type="password"
          id="password"
          class="password-input"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <span
          class="show-password"
          id="togglePassword"
          title="Show password"
        >👁️</span>

      </div>


      <div class="forgot">
        <a href="#" id="forgotPassword">
          Forgot Password?
        </a>
      </div>


      <button
        type="submit"
        class="login-btn"
        id="loginBtn"
      >
        Login
      </button>

    </form>


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- REGISTER -->

    <div class="register">
      Don't have an account?
      <a href="#" id="registerLink">
        Create Account
      </a>
    </div>


    <!-- WHATSAPP -->

    <div class="whatsapp-section">

      <div class="whatsapp-text">
        Need Help? Contact us on WhatsApp
      </div>

      <a
        class="whatsapp-icon"
        href="https://wa.me/923028026575"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Contact us on WhatsApp"
      >
        ☎
      </a>

    </div>

  </div>


  <script>

    /* =====================================
       SUPABASE CONFIG
       ===================================== */

    const SUPABASE_URL = "https://cdgmtleyzggeryvugcrf.supabase.co";

    const SUPABASE_PUBLIC_KEY = "sb_publishable_9veiB1eRPPyLHR8X2oldMQ_AcLz9Jb2";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLIC_KEY
    );


    /* =====================================
       SHOW / HIDE PASSWORD
       ===================================== */

    const passwordInput =
      document.getElementById("password");

    const togglePassword =
      document.getElementById("togglePassword");

    togglePassword.addEventListener("click", function () {

      if (passwordInput.type === "password") {

        passwordInput.type = "text";
        togglePassword.textContent = "🙈";

      } else {

        passwordInput.type = "password";
        togglePassword.textContent = "👁️";

      }

    });


    /* =====================================
       LOGIN
       ===================================== */

    const loginForm =
      document.getElementById("loginForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");


    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      message.textContent = "";
      message.style.color = "";


      try {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {

          message.textContent = error.message;
          message.style.color = "#ff6b7a";

          loginBtn.disabled = false;
          loginBtn.textContent = "Login";

          return;
        }


        message.textContent =
          "Login successful. Opening Dashboard...";

        message.style.color = "#5ee68a";


        setTimeout(function() {

          window.location.href = "dashboard.html";

        }, 700);


      } catch (error) {

        message.textContent =
          "Something went wrong. Please try again.";

        message.style.color = "#ff6b7a";

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";

      }

    });


    /* =====================================
       FORGOT PASSWORD
       ===================================== */

    document
      .getElementById("forgotPassword")
      .addEventListener("click", function(event) {

        event.preventDefault();

        alert(
          "Password reset will be connected after the authentication setup."
        );

      });


    /* =====================================
       REGISTER
       ===================================== */

    document
      .getElementById("registerLink")
      .addEventListener("click", function(event) {

        event.preventDefault();

        alert(
          "Registration page will be connected next."
        );

      });


    /* =====================================
       CHECK EXISTING SESSION
       ===================================== */

    async function checkSession() {

      const { data } =
        await supabaseClient.auth.getSession();

      if (data && data.session) {

        window.location.href = "dashboard.html";

      }

    }

    checkSession();

  </script>

</body>
  </html>
